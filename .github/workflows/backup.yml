name: backup

# Respaldo de MLflow en S3: la base y los artefactos en un solo .7z, en
# s3://<bucket>/backup/backup_mlflow_AAAAMMDD-HHMMSS.7z (hora UTC). Destroy
# borra esa carpeta: para conservar el respaldo, descargalo desde la consola
# de S3. Si la EC2 esta detenida, la enciende y al terminar la detiene.
on:
  workflow_dispatch:

permissions:
  contents: read

# Nunca a la vez que deploy, destroy o restore.
concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Stack
        id: stack
        uses: ./.github/actions/stack
        with:
          start: "true"

      - name: Hay stack
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          [ -n "$INSTANCE_ID" ] || { echo "::error::No hay ningun stack desplegado: lanza deploy."; exit 1; }

      # Comprimir al maximo es lento: unos 5 MB por segundo de datos sin comprimir.
      - name: Respaldo en S3 (SSM)
        id: run
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ steps.stack.outputs.instance_id }}
          command: bash /opt/mlflow/scripts/backup_mlflow.sh
          comment: respaldo en S3
          timeout-minutes: 150

      - name: Resumen
        if: always() && steps.run.outputs.output != ''
        env:
          OUTPUT: ${{ steps.run.outputs.output }}
        run: |
          {
            echo "### Respaldo de MLflow"
            echo '```'
            grep -E '^(Respaldo completo|  experimentos=|La base esta vacia|ERROR|Respaldo FALLIDO)' <<<"$OUTPUT" || true
            echo '```'
            echo "Para conservarlo despues de un destroy o un reinicio del lab, descargalo desde la consola de S3: bucket \`${ARTIFACTS_BUCKET}\`, carpeta \`backup/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Volver a detener la EC2
        if: always() && steps.stack.outputs.started == 'true'
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          # Estaba detenida antes del workflow: se deja igual.
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
          echo "EC2 detenida de nuevo."
