name: backup

# Respaldo de MLflow en Google Drive. La EC2 junta la base y los artefactos en
# un solo .7z, s3://<bucket>/backup/backup_mlflow_AAAAMMDD-HHMMSS.7z (hora
# UTC); despues el runner lo sube a la carpeta de Drive del secret
# GDRIVE_FOLDER_ID, comprueba el MD5 y lo borra de S3: backup/ es solo de
# paso. Si la EC2 esta detenida, la enciende y al terminar la detiene.
on:
  workflow_dispatch:

permissions:
  contents: read

# Nunca a la vez que deploy, destroy o restore.
concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      # Antes de encender nada: que las credenciales y la carpeta de Drive sirvan.
      - name: Google Drive
        uses: ./.github/actions/gdrive
        with:
          command: check
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Stack
        id: stack
        uses: ./.github/actions/stack
        with:
          start: "true"

      - name: Hay stack
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          [ -n "$INSTANCE_ID" ] || { echo "::error::No hay ningun stack desplegado: lanza deploy."; exit 1; }

      # Comprimir al maximo es lento: unos 5 MB por segundo de datos sin comprimir.
      - name: Respaldo en S3 (SSM)
        id: run
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ steps.stack.outputs.instance_id }}
          command: bash /opt/mlflow/scripts/backup_mlflow.sh
          comment: respaldo de MLflow
          timeout-minutes: 150

      # Antes de subir a Drive, que no necesita la EC2.
      - name: Volver a detener la EC2
        if: always() && steps.stack.outputs.started == 'true'
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          # Estaba detenida antes del workflow: se deja igual.
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
          echo "EC2 detenida de nuevo."

      # Sube cada .7z de backup/ (tambien el que haya dejado ahi una subida
      # anterior que fallo), comprueba el MD5 y lo borra de S3.
      - name: Subir a Google Drive
        id: drive
        if: "!cancelled() && steps.run.outcome == 'success'"
        timeout-minutes: 60
        uses: ./.github/actions/gdrive
        with:
          command: upload
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Resumen
        if: always() && steps.run.outputs.output != ''
        env:
          OUTPUT: ${{ steps.run.outputs.output }}
          DRIVE: ${{ steps.drive.outcome }}
          NAME: ${{ steps.drive.outputs.name }}
          SIZE: ${{ steps.drive.outputs.size }}
          LINK: ${{ steps.drive.outputs.link }}
        run: |
          {
            echo "### Respaldo de MLflow"
            echo '```'
            grep -E '^(Respaldo completo|  experimentos=|La base esta vacia|ERROR|Respaldo FALLIDO)' <<<"$OUTPUT" || true
            echo '```'
            if [ "$DRIVE" = success ] && [ -n "$NAME" ]; then
              echo "En Google Drive: [${NAME}](${LINK}) (${SIZE}). Ya no esta en S3."
            elif [ "$DRIVE" = failure ]; then
              echo "**No se pudo subir a Google Drive** (el error esta en el paso *Subir a Google Drive*)."
              echo "El .7z sigue en \`s3://${ARTIFACTS_BUCKET}/backup/\` (un destroy lo borraria): el proximo backup lo vuelve a intentar."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
