name: deploy

# Etapas: config -> terraform -> build (imagen en ECR) -> deploy (EC2 por SSM)
on:
  workflow_dispatch:

permissions:
  contents: read

# deploy y destroy nunca corren a la vez
concurrency:
  group: mlflow-infra
  cancel-in-progress: false

# Credenciales del Learner Lab (AWS Details). Caducan con cada sesion:
# actualiza los tres secrets antes de lanzar el workflow.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      auth: ${{ steps.auth.outputs.enabled }}
    steps:
      - name: Secret POSTGRES_PASSWORD
        run: |
          if [ -z "$TF_VAR_postgres_password" ]; then
            echo "::error::Falta el secret POSTGRES_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Con la variable AUTH en S y los dos secrets, MLflow pide usuario y
      # clave. Con AUTH en N (o sin la variable o sin los secrets), no.
      - name: Autenticacion de MLflow
        id: auth
        env:
          AUTH: ${{ vars.AUTH }}
          MLFLOW_USER: ${{ secrets.MLFLOW_USER }}
          MLFLOW_AUTH_PASSWORD: ${{ secrets.MLFLOW_AUTH_PASSWORD }}
        run: |
          auth=$(tr -d '[:space:]' <<<"$AUTH" | tr '[:lower:]' '[:upper:]')
          enabled=false
          case "$auth" in
            S)
              if [ -z "$MLFLOW_USER" ] || [ -z "$MLFLOW_AUTH_PASSWORD" ]; then
                echo "::warning::AUTH esta en S pero falta el secret MLFLOW_USER o MLFLOW_AUTH_PASSWORD: MLflow queda SIN autenticacion."
              elif ! [[ "$MLFLOW_USER" =~ ^[A-Za-z0-9._@-]+$ ]]; then
                echo "::error::MLFLOW_USER solo puede tener letras, numeros y . _ @ - (sin espacios ni ':')."
                exit 1
              elif [ "${#MLFLOW_AUTH_PASSWORD}" -lt 12 ] || [[ "$MLFLOW_AUTH_PASSWORD" == *$'\n'* ]]; then
                echo "::error::MLFLOW_AUTH_PASSWORD debe tener al menos 12 caracteres (lo exige MLflow) y una sola linea."
                exit 1
              else
                enabled=true
              fi
              ;;
            N | "") ;;
            *)
              echo "::error::La variable AUTH debe ser S o N (es '$AUTH')."
              exit 1
              ;;
          esac
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            echo "MLflow con autenticacion (usuario del secret MLFLOW_USER)."
          else
            echo "MLflow sin autenticacion."
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Crear buckets si no existen
        run: |
          # Con la CLI: Terraform no puede gestionar buckets en el Learner Lab
          # (ver infra/terraform/main.tf).
          create() {
            if [ "$AWS_REGION" = us-east-1 ]; then
              aws s3api create-bucket --bucket "$1" >/dev/null
            else
              aws s3api create-bucket --bucket "$1" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}" >/dev/null
            fi
            echo "Bucket creado: $1"
          }
          [ "$STATE_BUCKET_EXISTS" = true ] || create "$TF_STATE_BUCKET"
          [ "$ARTIFACTS_BUCKET_EXISTS" = true ] || create "$ARTIFACTS_BUCKET"

      - name: Carpeta de respaldos
        run: |
          # Vacia, para subir a mano un .7z antes de restaurar. Si ya existe,
          # sus respaldos no se tocan.
          aws s3api put-object --bucket "$ARTIFACTS_BUCKET" --key backup/ >/dev/null
          echo "Respaldos en s3://${ARTIFACTS_BUCKET}/backup/"

  terraform:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_mlflow_auth_enabled: ${{ needs.config.outputs.auth }}
      TF_VAR_mlflow_auth: ${{ needs.config.outputs.auth == 'true' && format('{0}:{1}', secrets.MLFLOW_USER, secrets.MLFLOW_AUTH_PASSWORD) || '' }}
    outputs:
      instance_id: ${{ steps.apply.outputs.instance_id }}
      public_ip: ${{ steps.apply.outputs.public_ip }}
      postgres_parameter: ${{ steps.apply.outputs.postgres_parameter }}
      auth_parameter: ${{ steps.apply.outputs.auth_parameter }}
      log_group: ${{ steps.apply.outputs.log_group }}
      server_log_group: ${{ steps.apply.outputs.server_log_group }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false # el wrapper ensucia la salida de `terraform output`

      - name: Terraform apply
        id: apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -input=false -auto-approve
          for name in instance_id public_ip postgres_parameter auth_parameter log_group server_log_group; do
            echo "${name}=$(terraform output -raw "$name")" >> "$GITHUB_OUTPUT"
          done

  build:
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Imagen en ECR
        id: image
        run: |
          # El tag es el hash git de infra/mlflow-server: solo se reconstruye si cambia.
          tag=$(git rev-parse HEAD:infra/mlflow-server)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" \
              --image-ids "imageTag=${tag}" >/dev/null 2>&1; then
            echo "La imagen ${tag} ya existe en ECR; no se reconstruye."
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          docker build -t "${ECR_REPOSITORY}:${tag}" infra/mlflow-server
          docker push "${ECR_REPOSITORY}:${tag}"

  deploy:
    needs: [terraform, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTANCE_ID: ${{ needs.terraform.outputs.instance_id }}
      PUBLIC_IP: ${{ needs.terraform.outputs.public_ip }}
      POSTGRES_PARAMETER: ${{ needs.terraform.outputs.postgres_parameter }}
      AUTH_PARAMETER: ${{ needs.terraform.outputs.auth_parameter }}
      LOG_GROUP: ${{ needs.terraform.outputs.log_group }}
      SERVER_LOG_GROUP: ${{ needs.terraform.outputs.server_log_group }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Archivos a S3 y comando de deploy
        id: files
        run: |
          # Los archivos viajan por S3; la instancia los descarga y ejecuta deploy.sh.
          for f in docker-compose.yml infra/deploy.sh infra/oom-alert.sh; do
            aws s3 cp "$f" "s3://${ARTIFACTS_BUCKET}/deploy/$(basename "$f")"
          done
          aws s3 sync infra/scripts/ "s3://${ARTIFACTS_BUCKET}/deploy/scripts/" --delete

          cmd="mkdir -p /opt/mlflow"
          cmd+=" && aws s3 cp s3://${ARTIFACTS_BUCKET}/deploy/ /opt/mlflow/ --recursive --quiet"
          cmd+=" && MLFLOW_IMAGE=${ECR_REPOSITORY}:${IMAGE_TAG} MLFLOW_PUBLIC_HOST=${PUBLIC_IP}"
          cmd+=" ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET} AWS_REGION=${AWS_REGION}"
          cmd+=" POSTGRES_PARAMETER=${POSTGRES_PARAMETER} LOG_GROUP=${LOG_GROUP}"
          cmd+=" SERVER_LOG_GROUP=${SERVER_LOG_GROUP} AUTH_PARAMETER=${AUTH_PARAMETER}"
          cmd+=" bash /opt/mlflow/deploy.sh"
          echo "command=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Deploy en la EC2 (SSM)
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ env.INSTANCE_ID }}
          command: ${{ steps.files.outputs.command }}
          comment: deploy ${{ github.sha }}
          timeout-minutes: 15

      - name: Resumen
        run: |
          {
            echo "### MLflow: http://${PUBLIC_IP}:8080"
            if [ -n "$AUTH_PARAMETER" ]; then
              echo "Con autenticacion: usuario y clave de los secrets \`MLFLOW_USER\` y \`MLFLOW_AUTH_PASSWORD\`."
            else
              echo "Sin autenticacion (variable \`AUTH\` en N, o faltan los secrets)."
            fi
            echo "Accesos por IP: CloudWatch > Logs Insights > Saved queries > \`mlflow/accesos-por-ip\`"
            echo "Respaldos: **Actions → backup**, en \`s3://${ARTIFACTS_BUCKET}/backup/\`."
          } >> "$GITHUB_STEP_SUMMARY"

