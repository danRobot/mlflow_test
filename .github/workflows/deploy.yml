name: deploy

# Crea o actualiza la infraestructura (Terraform), construye la imagen del
# servidor en ECR si cambio infra/mlflow-server/ y la despliega en la EC2 por SSM.
on:
  workflow_dispatch:

permissions:
  contents: read

# deploy y destroy nunca corren a la vez
concurrency:
  group: mlflow-infra
  cancel-in-progress: false

# Credenciales del Learner Lab (AWS Details). Caducan con cada sesion:
# actualiza los tres secrets antes de lanzar el workflow.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_mlflow_auth_password: ${{ secrets.MLFLOW_AUTH_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false # el wrapper ensucia la salida de `terraform output`

      - name: Credenciales y buckets
        run: |
          if ! ident=$(aws sts get-caller-identity --query '[Account, Arn]' --output text); then
            echo "::error::Credenciales invalidas o caducadas. Copia de nuevo los tres valores de AWS Details del Learner Lab a los secrets."
            exit 1
          fi
          account=${ident%%[[:space:]]*}
          arn=${ident##*[[:space:]]}
          echo "::add-mask::${account}"
          echo "::add-mask::${arn##*/}" # sesion del lab: lleva tu nombre

          # Los buckets se crean con la CLI: Terraform no puede gestionarlos
          # en el Learner Lab (ver infra/terraform/main.tf).
          create_bucket() {
            aws s3api head-bucket --bucket "$1" 2>/dev/null && return 0
            if [ "$AWS_REGION" = us-east-1 ]; then
              aws s3api create-bucket --bucket "$1" >/dev/null
            else
              aws s3api create-bucket --bucket "$1" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}" >/dev/null
            fi
            echo "Bucket creado: $1"
          }
          state="mlflow-tfstate-${account}-${AWS_REGION}"
          artifacts="mlflow-artifacts-${account}-${AWS_REGION}"
          create_bucket "$state"
          create_bucket "$artifacts"
          echo "TF_STATE_BUCKET=${state}" >> "$GITHUB_ENV"
          echo "ARTIFACTS_BUCKET=${artifacts}" >> "$GITHUB_ENV"

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -input=false -auto-approve
          for name in ecr_repository_url instance_id public_ip auth_parameter; do
            value=$(terraform output -raw "$name")
            echo "${name^^}=${value}" >> "$GITHUB_ENV"
          done

      - name: Imagen en ECR
        run: |
          # El tag es el hash git de infra/mlflow-server: solo se reconstruye si cambia.
          tag=$(git rev-parse HEAD:infra/mlflow-server)
          image="${ECR_REPOSITORY_URL}:${tag}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" \
              --image-ids "imageTag=${tag}" >/dev/null 2>&1; then
            echo "La imagen ${image} ya existe; no se reconstruye."
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          docker build -t "${image}" infra/mlflow-server
          docker push "${image}"

      - name: Deploy en la EC2 (SSM)
        run: |
          # compose y deploy.sh viajan por S3; la instancia los descarga y ejecuta.
          aws s3 cp docker-compose.yml "s3://${ARTIFACTS_BUCKET}/deploy/docker-compose.yml"
          aws s3 cp infra/deploy.sh "s3://${ARTIFACTS_BUCKET}/deploy/deploy.sh"

          echo "Esperando a que la instancia se registre en SSM..."
          status=""
          for _ in $(seq 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && break
            sleep 10
          done
          [ "$status" = "Online" ] || { echo "La instancia no aparece en SSM"; exit 1; }

          cmd="mkdir -p /opt/mlflow"
          cmd+=" && aws s3 cp s3://${ARTIFACTS_BUCKET}/deploy/ /opt/mlflow/ --recursive --quiet"
          cmd+=" && MLFLOW_IMAGE=${IMAGE} MLFLOW_PUBLIC_HOST=${PUBLIC_IP} ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET}"
          cmd+=" AWS_REGION=${AWS_REGION} AUTH_PARAMETER=${AUTH_PARAMETER} bash /opt/mlflow/deploy.sh"
          id=$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$(jq -cn --arg c "$cmd" '{commands: [$c]}')" \
            --query Command.CommandId --output text)

          for _ in $(seq 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending | InProgress | Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = "Success" ] || { echo "Deploy: ${status}"; exit 1; }

          echo "### MLflow: http://${PUBLIC_IP}:8080" >> "$GITHUB_STEP_SUMMARY"
