name: destroy

# Etapas: config -> terraform (destroy) -> buckets
# Borra TODO: servidor, base de datos (runs y metricas), modelos en S3,
# imagenes en ECR, logs y el bucket del estado. La cuenta queda vacia.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para borrar todo, incluidos runs y modelos'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_state: ${{ steps.state.outputs.has_state }}
    steps:
      - name: Confirmacion
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != destroy ]; then
            echo "::error::Escribe destroy en el campo de confirmacion para borrar todo."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Estado de Terraform
        id: state
        run: |
          echo "has_state=${STATE_BUCKET_EXISTS}" >> "$GITHUB_OUTPUT"
          if [ "$STATE_BUCKET_EXISTS" != true ]; then
            echo "No existe el bucket del estado: no hay stack que destruir."
          fi

  terraform:
    needs: config
    if: needs.config.outputs.has_state == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7

      - name: Terraform destroy
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -input=false -auto-approve

  # Corre si terraform termino bien o se salto porque no habia estado.
  buckets:
    needs: [config, terraform]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Borrar buckets
        run: |
          # Artefactos (modelos) primero; el del estado al final, ya vacio.
          if [ "$ARTIFACTS_BUCKET_EXISTS" = true ]; then
            aws s3 rb "s3://${ARTIFACTS_BUCKET}" --force
          fi
          if [ "$STATE_BUCKET_EXISTS" = true ]; then
            aws s3 rb "s3://${TF_STATE_BUCKET}" --force
          fi
