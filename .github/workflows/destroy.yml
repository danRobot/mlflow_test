name: destroy

# Etapas: config -> respaldo (Google Drive) -> terraform (destroy) -> limpieza
# Borra TODO en AWS: servidor, base de datos (runs y metricas), modelos en S3,
# imagenes en ECR, logs, los parametros de Parameter Store que creo Terraform
# y el bucket del estado. La cuenta queda vacia. Lo que este en Google Drive
# no se toca: el proximo deploy lo restaura.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para borrar todo, incluidos runs y modelos'
        required: true
        type: string
      respaldo:
        description: "Respaldar antes en Google Drive (si falla, no se borra nada)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_state: ${{ steps.state.outputs.has_state }}
    steps:
      - name: Confirmacion
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != destroy ]; then
            echo "::error::Escribe destroy en el campo de confirmacion para borrar todo."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Estado de Terraform
        id: state
        run: |
          echo "has_state=${STATE_BUCKET_EXISTS}" >> "$GITHUB_OUTPUT"
          if [ "$STATE_BUCKET_EXISTS" != true ]; then
            echo "No existe el bucket del estado: no hay stack que destruir."
          fi

  # Ultimo respaldo con MLflow detenido (consistente). Si falla, terraform y
  # limpieza no corren: no se borra nada.
  respaldo:
    needs: config
    if: needs.config.outputs.has_state == 'true' && inputs.respaldo
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Stack
        id: stack
        uses: ./.github/actions/stack
        with:
          start: "true"

      - name: Google Drive configurado
        id: check
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          GDRIVE: ${{ steps.stack.outputs.gdrive_parameter }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "::warning::No hay instancia en el estado: no hay nada que respaldar."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$GDRIVE" ]; then
            echo "::warning::Google Drive no esta configurado (secret GDRIVE_RCLONE_CONF): se destruye SIN respaldo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Respaldo en Google Drive (SSM)
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ steps.stack.outputs.instance_id }}
          command: bash /opt/mlflow/scripts/backup_mlflow.sh --stop-server
          comment: respaldo antes de destroy
          timeout-minutes: 60

      - name: Si fallo
        if: failure()
        run: |
          echo "::error::No se pudo respaldar en Google Drive y no se borro nada. Revisa el error, o lanza destroy con 'Respaldar antes' desmarcado para borrar sin respaldo."

  terraform:
    needs: [config, respaldo]
    if: needs.config.outputs.has_state == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7

      - name: Terraform destroy
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -input=false -auto-approve

  # Corre si terraform termino bien o se salto porque no habia estado.
  limpieza:
    needs: [config, terraform]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      # Va antes de borrar los buckets: si falla, el estado de Terraform se
      # conserva y se puede repetir el destroy.
      - name: Borrar parametros de Terraform
        run: |
          # Todos los parametros de Parameter Store que creo Terraform: llevan
          # las default_tags del provider (Project=mlflow, ManagedBy=terraform),
          # asi que se encuentran aunque ya no esten en el estado (por ejemplo
          # tras reiniciar el lab), en cuyo caso harian fallar el siguiente
          # deploy con ParameterAlreadyExists. Si habia estado, terraform
          # destroy ya los borro y aqui no queda ninguno. Sus valores vienen de
          # secrets de GitHub: deploy los vuelve a crear.
          filters='[{"Key":"tag:Project","Values":["mlflow"]},{"Key":"tag:ManagedBy","Values":["terraform"]}]'
          names=$(aws ssm describe-parameters --parameter-filters "$filters" \
            --query 'Parameters[].Name' --output text)
          if [ -z "$names" ] || [ "$names" = None ]; then
            echo "No quedan parametros de Terraform."
            exit 0
          fi
          for name in $names; do
            if err=$(aws ssm delete-parameter --name "$name" 2>&1); then
              echo "Parametro borrado: $name"
            else
              case "$err" in
                *ParameterNotFound*) echo "Ya no existia: $name" ;;
                *) echo "::error::No se pudo borrar el parametro $name: ${err}"; exit 1 ;;
              esac
            fi
          done

      - name: Borrar buckets
        run: |
          # Artefactos (modelos) primero; el del estado al final, ya vacio.
          if [ "$ARTIFACTS_BUCKET_EXISTS" = true ]; then
            aws s3 rb "s3://${ARTIFACTS_BUCKET}" --force
          fi
          if [ "$STATE_BUCKET_EXISTS" = true ]; then
            aws s3 rb "s3://${TF_STATE_BUCKET}" --force
          fi
