name: destroy

# Borra TODO: servidor, base de datos (runs y metricas), modelos en S3,
# imagenes en ECR y el bucket del estado de Terraform. La cuenta queda vacia.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para borrar todo, incluidos runs y modelos'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_mlflow_auth_password: ${{ secrets.MLFLOW_AUTH_PASSWORD }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7

      - name: Terraform destroy y buckets
        working-directory: infra/terraform
        run: |
          if ! ident=$(aws sts get-caller-identity --query '[Account, Arn]' --output text); then
            echo "::error::Credenciales invalidas o caducadas. Copia de nuevo los tres valores de AWS Details del Learner Lab a los secrets."
            exit 1
          fi
          account=${ident%%[[:space:]]*}
          arn=${ident##*[[:space:]]}
          echo "::add-mask::${account}"
          echo "::add-mask::${arn##*/}" # sesion del lab: lleva tu nombre
          state="mlflow-tfstate-${account}-${AWS_REGION}"
          artifacts="mlflow-artifacts-${account}-${AWS_REGION}"

          if aws s3api head-bucket --bucket "$state" 2>/dev/null; then
            terraform init -input=false \
              -backend-config="bucket=${state}" \
              -backend-config="region=${AWS_REGION}"
            terraform destroy -input=false -auto-approve
          else
            echo "No existe el bucket del estado: no hay stack que destruir."
          fi

          # Solo se llega aqui si destroy termino bien. Los buckets van al final:
          # el de artefactos con los modelos y el del estado, ya vacio.
          for bucket in "$artifacts" "$state"; do
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              aws s3 rb "s3://${bucket}" --force
            fi
          done
