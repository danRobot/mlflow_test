name: destroy

# Borra TODO lo que crea Terraform: servidor, base de datos (runs y metricas),
# modelos en S3 e imagenes en ECR. El bootstrap (estado y rol de GitHub) se queda.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para borrar todo, incluidos runs y modelos'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_mlflow_auth_password: ${{ secrets.MLFLOW_AUTH_PASSWORD }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7

      - name: Terraform destroy
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -input=false -auto-approve
