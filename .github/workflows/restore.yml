name: restore

# Restaura el respaldo mas reciente de s3://<bucket>/backup/ (por el nombre,
# backup_mlflow_AAAAMMDD-HHMMSS.7z) y, si sale bien, borra ese .7z de S3.
# REEMPLAZA la base actual de MLflow. Si la carpeta no tiene ningun .7z,
# falla: en una instalacion limpia (despues de un destroy o un reinicio del
# lab) sube antes el .7z a mano desde la consola de S3, carpeta backup/.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "restaurar" para REEMPLAZAR la base actual por el ultimo respaldo de la carpeta backup/ de S3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mlflow-infra
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Confirmacion
        env:
          CONFIRM: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRM" != restaurar ]; then
            echo "::error::Escribe restaurar en la confirmacion para reemplazar la base actual."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws-setup

      - name: Stack
        id: stack
        uses: ./.github/actions/stack
        with:
          start: "true"

      - name: Hay stack
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          [ -n "$INSTANCE_ID" ] || { echo "::error::No hay ningun stack desplegado: lanza deploy y despues restore."; exit 1; }

      - name: Restore desde S3 (SSM)
        id: run
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ steps.stack.outputs.instance_id }}
          command: bash /opt/mlflow/scripts/restore_mlflow.sh --yes
          comment: restore desde S3
          timeout-minutes: 120

      - name: Resumen
        if: always() && steps.run.outputs.output != ''
        env:
          OUTPUT: ${{ steps.run.outputs.output }}
        run: |
          {
            echo "### restore"
            echo '```'
            # El resumen del respaldo elegido y el resultado (o el error).
            sed -n -e '/^  Respaldo  /,/^  MLflow/p' -e '/^Restauracion terminada/,/^  artefactos/p' \
              -e '/^ERROR/p' <<<"$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Volver a detener la EC2
        if: always() && steps.stack.outputs.started == 'true'
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
        run: |
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
          echo "EC2 detenida de nuevo (estaba detenida antes del workflow)."
